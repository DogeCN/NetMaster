# NetMaster 服务端部署配置（v2：Worker + Session Durable Object）。
#
# 这里没有任何要你填的东西：域名绑定是你自己的事（控制台加 custom domain，
# 或自己 wrangler 一行命令），项目不管可达性。唯一的 secret 是 PASSWORD，
# 走 `wrangler secret put`（CI 透传 GitHub Secret），不在本文件管辖范围内。

name = "netmaster"
main = "_worker.js"
compatibility_date = "2025-11-04"

# keep_vars 默认是 false，显式写出：部署时删除 Worker 上已存在、但本文件里
# 没有的变量。一份不描述现实的配置文件比没有配置文件更糟。
keep_vars = false

# Session DO：每条 WS 连接一个实例，承载认证与多路复用。不落盘——
# 状态只在实例内存与 WS 生命周期内有效，休眠/驱逐即随流一起结束。
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
# 免费版必须用 new_sqlite_classes（new_classes 是旧版 SQLite 迁移，免费计划不接受）
new_sqlite_classes = ["SessionDO"]

# Router DO 已砍（2026-10-06）：中继列表硬编三条实测幸存者（proxyip.js），
# 跨会话路由记忆的收益撑不起一个 DO 的子请求与运维成本。v3 迁移把类删掉。
[[migrations]]
tag = "v3"
deleted_classes = ["RouterDO"]

# KV：profile 度量的落盘（flushProfile）。出口排名（proxyip:top）已随动态刷新
# 一起移除，KV 只写度量、每会话有硬预算（PROF_FLUSHES_PER_SESSION）。
# id 是占位符——真实 namespace id 由 deploy 工作流从 CF API 解析后注入，
# 直接 `wrangler deploy` 本文件会因 id 非法失败（这是有意的：别拿占位符上线）。
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

