name: acceptance

# 真实部署验收：拿已部署的 v2 Worker + 真实客户端（Go）跑一遍 PRD §14 的量化项。
# 与 e2e.yml（协议层 Node 验收）互补 —— 这里验的是"用户实际会走的路"：
#   node 侧验协议与状态码，本工作流验 TLS/ECH → WS → Session DO → 出口 → 回程。
#
# 不部署、不改 Worker：只消费已部署的 netmaster.edge-tunnel.workers.dev。

on:
  # push 触发器只为让 GitHub 注册这个工作流（默认分支之外的 workflow_dispatch-only
  # 文件不会被注册，gh workflow run 会 404），顺带让协议/出口改动自动跑一遍验收。
  push:
    branches: [main, v2]
    paths:
      - ".github/workflows/acceptance.yml"
      - "server/src/**"
      - "client/internal/outbound/**"
      - "client/internal/selector/**"
  workflow_dispatch:
    inputs:
      worker:
        # 默认留空 → 用 repo variable NETMASTER_WORKER。原先硬编
        # netmaster.edge-tunnel.workers.dev，换账号后那个 worker 还在（且会被
        # 测试打到限额），于是每次 push 触发的验收都在测一个已经不该测的部署，
        # 红得毫无信息量 —— 真实事故：2026-10-04 换账号后 push 触发的 acceptance
        # 连续失败，原因是旧账号 DO 额度耗尽后 WS 升级返回 1101。
        description: "deployed worker hostname (no scheme); empty = repo variable NETMASTER_WORKER"
        default: ""
      rounds:
        description: "repeated requests for the CF-hosted success-rate check"
        default: "20"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Protocol-level checks
        working-directory: server
        run: |
          set -o pipefail   # node 的报错走 stderr，tail 会吞掉退出码，不加这步恒绿
          npm ci
          # 与 scripts/test-all.sh 同一份清单：crypto/protocol 是纯逻辑；
          # 其余套件经 socket.js 摸平台模块，必须挂 Node shim，否则
          # ERR_UNSUPPORTED_ESM_URL_SCHEME。
          for t in crypto protocol; do
            printf '%-12s ' "$t"
            node "test/$t.mjs" | tail -1
          done
          for t in integration proxyip race router refresh-relays; do
            printf '%-12s ' "$t"
            NODE_OPTIONS="--import ./test/shims/register.mjs" node "test/$t.mjs" | tail -1
          done

      # 解析"验收哪个部署"。留空就硬失败：live_test 在没有 worker 时会 t.Skip，
      # 而**跳过的 run 也是绿的** —— 那正是这个工作流最该防的假绿。
      - name: Resolve target worker
        id: target
        env:
          W: ${{ inputs.worker != '' && inputs.worker || vars.NETMASTER_WORKER }}
        run: |
          if [ -z "$W" ]; then
            echo "::error::no worker hostname: pass the 'worker' input, or set repo variable NETMASTER_WORKER (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "worker=$W" >> "$GITHUB_OUTPUT"
          echo "acceptance target: $W"

      # 直连出口 + 多路复用：一次跑完，输出即验收依据。
      - name: Live tunnel checks (direct exit + mux)
        working-directory: client
        env:
          NETMASTER_E2E_WORKER: ${{ steps.target.outputs.worker }}
          NETMASTER_E2E_PASSWORD: ${{ secrets.PASSWORD }}
        run: go test ./internal/outbound/ -run TestLive -v -count=1 -timeout 300s

      # CF 托管目标的成功率（M3 出口质量项，阈值口径见 PRD 附录 A7）：走 ProxyIP 竞速。
      - name: CF-hosted target success rate
        working-directory: client
        env:
          NETMASTER_E2E_WORKER: ${{ steps.target.outputs.worker }}
          NETMASTER_E2E_PASSWORD: ${{ secrets.PASSWORD }}
          NETMASTER_E2E_ROUNDS: ${{ inputs.rounds }}
        run: go test ./internal/outbound/ -run TestLiveCFHosted -v -count=1 -timeout 600s

      # 中继健康排名是否还在（由 refresh-relays 每小时写入；Cron 移除后 KV 只有这一个键）。
      # namespace id 走 repo variable（与 refresh-relays.yml 的 vars.NETMASTER_KV_ID 同源）：
      # id 是标识符不是凭据，但 wrangler.toml 的占位符策略是"真值不入库"，这里别再硬编——
      # namespace 重建后硬编的那份会静默指向空池。
      - name: KV health snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETMASTER_KV_ID: ${{ vars.NETMASTER_KV_ID }}
        run: |
          if [ -z "$NETMASTER_KV_ID" ]; then
            echo "vars.NETMASTER_KV_ID is not set — add it in repo Settings → Variables"
            exit 1
          fi
          for key in proxyip:top; do
            printf '%-14s ' "$key"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NETMASTER_KV_ID/values/$key" \
              || echo "(read failed)"
            echo
          done
