name: cron-debug

# 诊断 Cron 全灭：从 CI（干净网络）拿两份证据 ——
#   1. m0 探针对中继域名做 connect()，看边缘侧的失败签名（拒绝/超时/DNS）
#   2. wrangler tail 住 netmaster worker 跨一个 cron 触发点，抓 scheduled 日志
# 一次性诊断流程，结论落档后删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # —— 证据 1：边缘侧 connect() 到中继 ——
      - name: Probe relay reachability from the edge
        run: |
          BASE="https://netmaster-m0.edge-tunnel.workers.dev"
          T="${{ secrets.PROBE_TOKEN }}"
          for host in ProxyIP.HK.CMLiussss.net ProxyIP.US.CMLiussss.net 8.212.14.90; do
            echo "== connect $host:443 =="
            curl -sS "$BASE/w/connect?host=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$host")&port=443&t=$T" || echo "(probe request failed)"
            echo
          done

      # —— 证据 2：tail 跨一个 cron 触发点（cron 是 */10，最多等 10 分钟） ——
      - name: Tail worker across a cron fire
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          (npx wrangler tail netmaster --format pretty > /tmp/tail.log 2>&1) &
          TAIL_PID=$!
          sleep 660
          kill $TAIL_PID 2>/dev/null || true
          echo "===== tail log ====="
          cat /tmp/tail.log

      - name: KV state after the fire
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV="2ff6b8ebe80c4715b643ed46b45d8d09"
          for k in "cron:lastFired" "cron:lastRun" "proxyip:top"; do
            echo "== $k =="
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV/values/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$k")"
            echo
          done

      - name: Upload tail log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cron-tail-log
          path: /tmp/tail.log
          if-no-files-found: warn
