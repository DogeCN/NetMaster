name: ci

# Quality gate: build the bundle (which fails on a syntax error) -> unit tests.
# Deliberately thin — there is no linter or type-checker in this project yet, and
# a gate that only ever passes teaches you to ignore it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build.mjs is the real syntax gate: it concatenates src/ into _worker.js and
      # a stray character anywhere in src/ fails here rather than in production.
      # _worker.js 带 cloudflare:* 平台 import，只能做语法检查（Node 加载不了平台模块，
      # 那是 Workers 运行时的东西）。
      - name: Build worker bundle
        run: |
          node build.mjs
          node --check _worker.js

      - name: Unit tests
        run: |
          set -o pipefail   # node 的报错走 stderr，tail 会吞退出码 —— 不加这个测试挂了 CI 也是绿的
          # crypto/protocol 是纯逻辑；其余套件经 socket.js 摸平台模块，要挂 shim
          for t in crypto protocol; do
            printf '%-12s ' "$t"
            node "test/$t.mjs" | tail -1
          done
          for t in integration proxyip race router; do
            printf '%-12s ' "$t"
            NODE_OPTIONS="--import ./test/shims/register.mjs" node "test/$t.mjs" | tail -1
          done
