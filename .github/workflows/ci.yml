name: ci

# Quality gate: build the bundle (which fails on a syntax error) -> unit tests,
# for both halves of the project.
#
# 客户端单测原先只在打 tag 时跑（release.yml）。于是"编译不过的 main"能一路畅通
# —— 本项目真发生过两次，都是某个提交引用了只存在于别人工作区、尚未提交的符号。
# 那两次都没有任何自动信号，直到人肉发现。client 这个 job 就是那道信号。
#
# Deliberately thin — there is no linter or type-checker in this project yet, and
# a gate that only ever passes teaches you to ignore it.
on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build.mjs is the real syntax gate: it concatenates src/ into _worker.js and
      # a stray character anywhere in src/ fails here rather than in production.
      # _worker.js 带 cloudflare:* 平台 import，只能做语法检查（Node 加载不了平台模块，
      # 那是 Workers 运行时的东西）。
      - name: Build worker bundle
        run: |
          node build.mjs
          node --check _worker.js

      - name: Unit tests
        run: |
          set -o pipefail   # node 的报错走 stderr，tail 会吞退出码 —— 不加这个测试挂了 CI 也是绿的
          # 直接调 run-all.mjs，不在这里重抄一份套件清单。
          #
          # 之前这里是手写的两段 for 循环，于是新增套件必须记得回来加一行 ——
          # 回归套件 regressions.mjs 就是这么被落下的：本地 `npm test` 跑 8 套，
          # CI 只跑 7 套，测的还恰好是"作用域逃逸 / 字符集注入 / 打包器静默丢模块"
          # 这三条最该有门的。清单只留一份，在 run-all.mjs 里。
          npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 与 client/go.mod 对齐。写死一个更老的版本不会报错，只会让 GOTOOLCHAIN
          # 静默下载 go.mod 要求的那一个，于是每个 job 多付一次完整工具链下载，
          # 而且"声明的版本"和"真正跑的版本"从此不是一回事。
          go-version-file: client/go.mod

      # 客户端的 E2E（internal/outbound 的 TestProtoE2E*）会拉起
      # server/test/devserver.mjs，它 import "ws"。少了这一步，那几个用例会各自
      # 空等满 15 秒然后失败 —— 这个门就成了恒红的摆设。
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Vet
        working-directory: client
        run: go vet ./...

      # staticcheck 补的是 vet 抓不到的那一类：SA/SAF/S 系（恒假条件、丢弃的错误、
      # 无效赋值、未用字段…）。
      #
      # 为什么必须另加一道：`go vet` 与 gofmt 都是**格式与用法**门禁，它们全绿的代码
      # 完全可能是错的。实测过的真实缺陷：`defer` 写未命名返回值 —— `return res` 先
      # 把 res 拷进返回槽位、再执行 defer，于是那次赋值被丢弃、ECHWorked 恒为 false。
      # 那份代码 gofmt clean、vet exit 0、staticcheck 也 exit 0：三道全绿，逻辑全错。
      # —— 也因此，别指望这道门兜住全部：它是网，不是墙。
      #
      # 版本钉死：latest 会在某天静默换掉检查集，然后某天开始红。2025.1.1 是本地验证
      # 过能配 go.mod 里那个 go 1.26.3 的版本。
      #
      # 不开 -checks ST*（stylecheck）：那批是命名/注释级的吹毛求疵，一次能报几十条。
      # 本文件顶上写着"一道永远绿的门等于教人忽略它"，反过来一道永远红的门同样等价 ——
      # 要开就单开一个 job，别混进这道。
      - name: Staticcheck
        working-directory: client
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: gofmt
        working-directory: client
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: Unit tests
        working-directory: client
        run: go test ./... -count=1 -timeout 600s

      # 本地 Windows 没有 C 工具链，-race 跑不了；而并发最重的三个包
      # （selector / outbound / proxy）恰恰只能靠这道门查。
      - name: Unit tests (race detector)
        working-directory: client
        run: go test ./... -count=1 -race -timeout 900s
