name: deploy

# Pipeline: checkout -> install -> build -> deploy (migrations 随 deploy 自动
# 应用) -> pass PASSWORD through.
#
# 没有部署后验证：CI 的网络环境和用户差别很大（GitHub runner 在美国，用户在
# 大陆），runner 能通不代表用户能通，反过来也一样。部署是否健康由"客户端
# 能不能连上"直接回答 —— Worker 没有任何 HTTP 端点来回答这个问题。
#
# 域名绑定不归项目管：Worker 只部署到 workers.dev，用户自己在自己的 zone 上
# 绑 custom domain（控制台或 wrangler 均可）。项目不持有域名，也就没有
# "改一行 routes"这类配置。
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

# One deploy at a time: two overlapping runs would race on `wrangler deploy`.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A broken build never deploys.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build worker bundle
        run: node build.mjs

      - name: Deploy Worker
        run: npx wrangler deploy

      # 鉴权口令：GitHub Secrets 配置，这里透传成 Worker Secret。
      # 客户端用同一个口令在首帧里做 HMAC-SHA256 签名，网络上只出现签名。
      # 未设置时部署仍会成功，但 Worker 会拒绝一切连接。
      - name: Pass PASSWORD through to Worker secret
        env:
          PASSWORD_VALUE: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "$PASSWORD_VALUE" ]; then
            echo "::warning::no PASSWORD secret set — the Worker will reject every client until it is set"
            exit 0
          fi
          printf '%s' "$PASSWORD_VALUE" | npx wrangler secret put PASSWORD
