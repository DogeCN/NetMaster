name: deploy

# Pipeline: checkout -> install -> build -> deploy (migrations 随 deploy 自动
# 应用) -> pass PASSWORD through.
#
# 没有部署后验证：CI 的网络环境和用户差别很大（GitHub runner 在美国，用户在
# 大陆），runner 能通不代表用户能通，反过来也一样。部署是否健康由"客户端
# 能不能连上"直接回答 —— Worker 没有任何 HTTP 端点来回答这个问题。
#
# 域名绑定不归项目管：Worker 只部署到 workers.dev，用户自己在自己的 zone 上
# 绑 custom domain（控制台或 wrangler 均可）。项目不持有域名，也就没有
# "改一行 routes"这类配置。
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

# One deploy at a time: two overlapping runs would race on `wrangler deploy`.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A broken build never deploys.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build worker bundle
        run: node build.mjs

      # KV 命名空间：Cron 每小时写入口健康排名（proxyip:top）。找不到就建一个同名
      # 的，然后把 wrangler.toml 里的占位 id 就地改写 —— 配置里不留需要用户填的
      # 东西，代价是 CI 负责把占位符换成真值。
      #
      # 走 REST API 而不是 `wrangler kv namespace list --json`：wrangler 4.146 的
      # 这个子命令没有 --json flag（会打印帮助页并退出 0），解析它只能靠正则扒
      # 人类可读的表格。API 的 JSON 是稳定的。
      - name: Ensure same-name KV namespace exists
        id: kv
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          id=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const n=(j.result||[]).find(x=>x.title==="netmaster");console.log(n?n.id:"");})')
          if [ -z "$id" ]; then
            echo "KV namespace 'netmaster' not found — creating"
            id=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"netmaster"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{console.log(JSON.parse(d).result.id);})')
          fi
          if [ -z "$id" ]; then
            echo "::error::failed to resolve KV namespace id for 'netmaster'"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "KV 'netmaster' ready ($id)"

      - name: Patch wrangler.toml
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          sed -i "s/^id = \"00000000000000000000000000000000\"/id = \"$KV_ID\"/" wrangler.toml
          grep -A3 kv_namespaces wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy

      # 鉴权口令：GitHub Secrets 配置，这里透传成 Worker Secret。
      # 客户端用同一个口令在首帧里做 HMAC-SHA256 签名，网络上只出现签名。
      # 未设置时部署仍会成功，但 Worker 会拒绝一切连接。
      - name: Pass PASSWORD through to Worker secret
        env:
          PASSWORD_VALUE: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "$PASSWORD_VALUE" ]; then
            echo "::warning::no PASSWORD secret set — the Worker will reject every client until it is set"
            exit 0
          fi
          printf '%s' "$PASSWORD_VALUE" | npx wrangler secret put PASSWORD

      # 部署闸门：没有非 workers.dev 的自定义域就直接判失败。
      #
      # 为什么必须自动化：实测（PRD A10）*.workers.dev 在大陆被 SNI 阻断，客户端
      # 连不上，而 workers.dev 也不发布 ECH 配置、客户端的 ECH 兜底无从启用。绑
      # 自定义域是纯手工步骤，忘了就会"部署成功、大陆用户全部连不上"——而"部署成功"
      # 这一项本身发现不了它。这一步把那个纯靠人记的项变成自动断言。
      - name: Require a custom domain (mainland reachability gate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: netmaster
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            > domains.json
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("domains.json", "utf8"));
            if (!d.success) { console.error("::error::Cloudflare API said failure: " + JSON.stringify(d.errors)); process.exit(1); }
            // 必须按 service（Worker 名）过滤：该端点返回**账户下全部 Worker** 的
            // 自定义域，不过滤的话账户里任意别的 Worker 绑了域名就能让闸门假通过
            // ——正好是它被造出来防的那个失败模式。
            const worker = process.env.WORKER_NAME;
            const mine = (d.result || []).filter((r) => r.service === worker);
            console.log("worker domains for " + worker + ": " +
              (mine.map((r) => r.hostname).join(", ") || "(none)"));
            const custom = mine
              .map((r) => r.hostname)
              .filter((h) => h && !h.endsWith(".workers.dev"));
            if (!custom.length) {
              console.error("::error::no custom domain bound to this Worker. *.workers.dev is SNI-blocked in mainland China (PRD A10): mainland clients cannot connect at all.");
              console.error("::error::bind one: Cloudflare dashboard -> Workers & Pages -> " + worker + " -> Settings -> Domains & Routes -> Add Custom Domain");
              process.exit(1);
            }
            console.log("gate ok: " + custom.join(", "));
          '
