name: live-debug

# 一次性诊断：tail 住 worker，同时在同一台 runner 上跑 Go live 测试，
# 服务端 DEBUG 日志与客户端失败一一对应。结论落档后删除。

on:
  # push 触发器只为注册工作流（非默认分支上的 workflow_dispatch-only 文件不会注册）。
  push:
    branches: [v2]
    paths: [".github/workflows/live-debug.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 带临时 DEBUG var 重新部署一次（同一份代码，只多日志）——tail 之前做，
      # 保证被观察的就是带日志的版本。
      - name: Redeploy with DEBUG
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node build.mjs
          KV=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const n=(JSON.parse(d).result||[]).find(x=>x.title==="netmaster");console.log(n?n.id:"")})')
          sed -i "s/^id = \"00000000000000000000000000000000\"/id = \"$KV\"/" wrangler.toml
          npx wrangler deploy --var DEBUG:1

      - name: Tail while driving live traffic
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NETMASTER_E2E_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          cd ../server && npm ci && cd ../client
          (npx --prefix ../server wrangler tail netmaster --format pretty > /tmp/tail.log 2>&1) &
          sleep 8
          NETMASTER_E2E_WORKER=netmaster.edge-tunnel.workers.dev \
            go test ./internal/outbound/ -run TestLiveDirectExitAndMux -v -count=1 -timeout 120s || true
          sleep 3
          pkill -f "wrangler tail" || true
          echo "===== tail log ====="
          sed 's/\x1b\[[0-9;]*m//g' /tmp/tail.log | tail -60

      - name: Upload tail log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-debug-tail
          path: /tmp/tail.log
          if-no-files-found: warn
