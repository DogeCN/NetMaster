name: restore-v010

# 一次性流程：v0.1.0 Release 的资产因误操作被删，本地网络无法上传大文件，
# 这里从 v0.1.0 tag 重新构建全部资产并传回该 Release。执行成功后本文件删除。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.1.0
        uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build worker bundle
        working-directory: server
        run: |
          npm ci
          node build.mjs

      - name: Build clients
        working-directory: client
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o netmaster-windows-amd64.exe ./cmd/netmaster
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o netmaster-linux-amd64 ./cmd/netmaster
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o netmaster-linux-arm64 ./cmd/netmaster

      - name: Upload assets to the v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 补回历史资产：按 tag 源码重建，非逐字节相同（Go 版本差异），notes 已注明
          gh release upload v0.1.0 \
            server/_worker.js server/wrangler.toml server/schema.sql \
            client/netmaster-windows-amd64.exe client/netmaster-linux-amd64 client/netmaster-linux-arm64 \
            --clobber
          gh release view v0.1.0 --json assets -q '[.assets[].name]'
